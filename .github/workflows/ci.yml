name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck / Lint / Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci
        env:
          # CI ではコミットしないので Git フックは入れない
          HUSKY: 0

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    # パスの区切りやファイル監視の振る舞いが OS で異なるため、Windows でも確かめる
    # Node は、サポートする最も古い版 (package.json の engines) と、その後の LTS・開発に使う版で確かめる
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.18.0, 24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Test
        run: npm test

  build-test:
    name: Build Test
    # 実際に latexmk でビルドするため、TeX Live を入れてから走らせる
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: otTATto/tex-setup@v1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Build Test
        run: npm run test:build

  package-test:
    name: Package Test (${{ matrix.os }})
    # npm で配るパッケージを実際に入れて、llp コマンドとして動くかを確かめる
    # TeX Live は Linux でしか入れられないので、ビルドまで確かめるのは Linux だけにする
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - if: runner.os == 'Linux'
        uses: otTATto/tex-setup@v1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Check Package
        run: |
          # パッケージを作った後も、手元の package.json は元に戻っている
          git diff --exit-code package.json
          # 利用者の環境で husky を動かさないよう、配るパッケージには prepare を入れない
          # Windows の tar は D:\... を別のホストと解釈するので、相対パスで渡す
          if (cd "$RUNNER_TEMP" && tar -xOzf ottatto-llp-*.tgz package/package.json) | grep '"prepare"'; then
            echo "::error::prepare script must not be published"
            exit 1
          fi

      # 利用者が使う環境に近づけるため、サポートする最も古い Node で動かす
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.5

      - name: Install Package
        run: npm install -g "$RUNNER_TEMP"/ottatto-llp-*.tgz

      - name: Run llp
        run: |
          llp --version
          llp --help

      - name: Build with llp
        if: runner.os == 'Linux'
        run: |
          mkdir "$RUNNER_TEMP/doc"
          cp server/fixtures/latexmkrc server/fixtures/sample.tex "$RUNNER_TEMP/doc/"
          cd "$RUNNER_TEMP/doc"
          llp build
          test -f sample.pdf
